name: PR labeler

# pull_request_target, not pull_request: a PR opened from a fork gets a
# read-only token under pull_request, and labelling then fails with
# "Resource not accessible by integration". pull_request_target runs in the
# base branch's context with a write token, which fork PRs need.
#
# That trigger is only safe because this job never checks out or executes the
# PR's code — the action reads the changed-file list through the API and
# nothing else. Do not add a checkout step here.
#
# Because it runs from the base branch, edits to this file (or to
# .github/labeler.yml) only take effect once merged, so the first run happens
# after this lands on main rather than on the PR that adds it.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
