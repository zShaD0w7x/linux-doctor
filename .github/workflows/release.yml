name: Release

on:
  push:
    tags: ["v*"]

# The release steps publish artifacts via GITHUB_TOKEN — without this the
# default token is read-only and softprops/action-gh-release gets a 403.
permissions:
  contents: write

jobs:
  # CLI: test, pack the npm tarball, create the release with it.
  cli:
    name: CLI tarball ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: Build the publishable tarball
        run: |
          set -x
          node --version && npm --version
          mkdir -p rel
          npm pack --pack-destination rel
          ls -la rel
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*.tgz
          generate_release_notes: true

  # Desktop app: Tauri bundles (AppImage first). Built on ubuntu-22.04 so the
  # AppImage links against an older glibc and runs on most distributions.
  gui:
    name: GUI bundles ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Dev deps are needed here: @tauri-apps/cli drives the build.
      - run: npm ci
      - run: npm run build:gui
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundles (appimage, deb)
        run: npx tauri build --bundles appimage,deb
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \( \
            -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist/ \;
          # Tauri already names outputs with the version; only normalize
          # spaces ("Linux Doctor_x.y.z_amd64") so upload keeps them sane.
          cd dist
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la
      - name: Attach bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
