name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The release steps publish artifacts via GITHUB_TOKEN — without this the
# default token is read-only and softprops/action-gh-release gets a 403.
# id-token + attestations enable Sigstore provenance via actions/attest.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # CLI: test, pack the npm tarball, create the release with it.
  cli:
    name: CLI tarball ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: Build the publishable tarball
        run: |
          set -x
          node --version && npm --version
          mkdir -p rel
          npm pack --pack-destination rel
          ls -la rel
      - name: Generate SHA256SUMS for tarball
        run: |
          cd rel && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS
          ls -lh rel/
      - name: Attest tarball provenance (SLSA L2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: rel/*
      - name: Extract changelog for this tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#v}
          awk -v tag="## [$TAG]" 'index($0, tag) {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > /tmp/notes.md
          echo "--- Notes for $TAG ---"; cat /tmp/notes.md
          test -s /tmp/notes.md || echo "No changelog entry for $TAG" > /tmp/notes.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          body_path: /tmp/notes.md
          generate_release_notes: false

  # Desktop app: Tauri bundles (AppImage first). Built on ubuntu-22.04 so the
  # AppImage links against an older glibc and runs on most distributions.
  gui:
    name: GUI bundles ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Dev deps are needed here: @tauri-apps/cli drives the build.
      - run: npm ci
      - run: npm run build:gui
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build Tauri bundles (appimage, deb, rpm)
        run: npx tauri build --bundles appimage,deb,rpm
        env:
          # Run linuxdeploy without FUSE — removes runner-to-runner variance.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \( \
            -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist/ \;
          # Tauri already names outputs with the version; only normalize
          # spaces ("Linux Doctor_x.y.z_amd64") so upload keeps them sane.
          cd dist
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la
      - name: Generate SHA256SUMS for bundles
        run: |
          cd dist && sha256sum * > SHA256SUMS-bundles.txt && cat SHA256SUMS-bundles.txt
          ls -lh dist/
      - name: Attest bundle provenance (SLSA L2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Attach bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false

  # npm registry publish with Sigstore provenance (OIDC trusted publishing).
  # Requires: npmjs.com > Package > Trusted Publishers > GitHub Actions (repo + workflow + environment)
  # GA 2025-07-31: no NPM_TOKEN needed, provenance auto-emitted with id-token.
  # Kept as opt-in — remove `if: false` when trusted publisher is configured.
  npm-publish:
    name: npm publish --provenance
    runs-on: ubuntu-latest
    needs: cli
    if: false # set to `startsWith(github.ref, 'refs/tags/v')` after configuring trusted publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --omit=dev
      - run: npm publish --provenance --access public
