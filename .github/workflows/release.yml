name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Test, pack, and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: Build the publishable tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pack
          mv linux-doctor-*.tgz "linux-doctor-${VERSION}.tgz"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: linux-doctor-*.tgz
          generate_release_notes: true
