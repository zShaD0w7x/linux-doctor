name: Bug report
description: Something is wrong with a check, the report, or the app.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Run `linux-doctor --support`** and attach the
        scrubbed JSON bundle — it carries the system facts and findings without
        your hostname, username, IPs or home paths.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `linux-doctor --version`
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      description: e.g. Fedora 42, Bazzite, Arch, Ubuntu 24.04 (`cat /etc/os-release`)
    validations:
      required: true
  - type: textarea
    id: support
    attributes:
      label: Support bundle
      description: Paste the `linux-doctor --support` output (privacy-scrubbed), or attach the file.
      render: json
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Steps and output
      render: shell
    validations:
      required: false
