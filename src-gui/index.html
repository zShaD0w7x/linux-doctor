<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Doctor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<style>
  :root {
    --bg: #0b0e14; --bg2: #11151e; --card: #161b26; --card2: #1e2432; --border: #262d3d;
    --text: #e8ebf2; --muted: #8b95a8;
    --red: #ff5f6a; --yellow: #ffc94d; --green: #34e08a; --blue: #6ea8ff; --purple: #b78bff;
    --accent: #3b6dff; --accent2: #7aa7ff; --hover: #232a3a; --evidence-bg: #0e1220;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.28);
    --radius: 13px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    --bg: #eef1f6; --bg2: #e6eaf1; --card: #ffffff; --card2: #f1f4f9; --border: #dfe4ee;
    --text: #171c26; --muted: #5b6577;
    --red: #d63a4b; --yellow: #9a6f00; --green: #0e8a4e; --blue: #2f66d0; --purple: #7a3fd0;
    --hover: #e8ecf4; --evidence-bg: #f4f6fa;
    --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 8px 24px rgba(23,28,38,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14.5px/1.5 -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    padding: 22px 18px 56px;
    background-image: radial-gradient(900px 480px at 18% -8%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
                      radial-gradient(700px 420px at 100% 0%, color-mix(in srgb, var(--blue) 9%, transparent), transparent 55%);
    background-attachment: fixed;
    font-feature-settings: "cv02", "cv03", "cv11", "ss01";
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  header .logo {
    font-size: 22px; width: 40px; height: 40px; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--card2), var(--card));
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  }
  h1 { font-size: 20px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.2; }
  .sysinfo { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .sysinfo .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 20%, transparent); vertical-align: 1px; margin-right: 5px; }
  .sysinfo .dot.stale { background: var(--yellow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 20%, transparent); }
  .sysinfo .ver { font-family: var(--mono); }
  .actions { margin-left: auto; display: flex; gap: 7px; }
  button {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 9px; font-size: 12.5px; cursor: pointer;
    transition: transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  button:hover { background: var(--hover); border-color: color-mix(in srgb, var(--border) 60%, var(--text) 40%); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.primary { background: linear-gradient(180deg, #4a7bff, #3362f0); border-color: #2a52d8; color: #fff; box-shadow: 0 1px 2px rgba(51,98,240,.4), 0 4px 14px rgba(51,98,240,.28); }
  button.primary:hover { background: linear-gradient(180deg, #5a88ff, #3b6dff); }
  button:disabled { opacity: .55; cursor: default; transform: none; }
  .banner { border-radius: var(--radius); padding: 6px 14px; margin-bottom: 10px; font-size: 13px; border: 1px solid var(--border); }
  .banner.ok { background: color-mix(in srgb, var(--green) 8%, var(--card)); border-color: color-mix(in srgb, var(--green) 30%, var(--border)); color: var(--green); }
  .banner.warn { background: color-mix(in srgb, var(--red) 8%, var(--card)); border-color: color-mix(in srgb, var(--red) 30%, var(--border)); color: var(--red); }
  .banner.running { background: var(--card); color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .newbadge { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: #14101e; background: var(--purple); border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
  .fixedbadge { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: #0d2418; background: var(--green); border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
  .lowbadge { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--muted); background: var(--card2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
  .checkid { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; flex-shrink: 0; background: var(--card); }
  /* Hero bar: one compact row = gauge + severity stats. */
  #summary { display: flex; align-items: center; gap: 18px; padding: 12px 18px; margin-bottom: 10px; background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .gauge { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
  .gauge svg { width: 100%; height: 100%; }
  .gauge .track { fill: none; stroke: var(--card2); stroke-width: 8; }
  .gauge .ring { fill: none; stroke-width: 8; stroke-linecap: round; }
  .gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .scorenum { font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .scoreout { font-size: 9px; color: var(--muted); margin-top: 1px; font-weight: 600; }
  .hero-main { min-width: 0; }
  .hero-main .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 750; }
  .scoredelta { font-size: 12.5px; font-weight: 700; margin-top: 2px; }
  .delta-up { color: var(--green); } .delta-down { color: var(--red); } .delta-flat { color: var(--muted); }
  .hero-stats { flex: 1; margin-left: 24px; display: flex; gap: 8px; align-items: stretch; }
  .stat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; padding: 5px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 9px; }
  .stat b { font-size: 18px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .stat.red b { color: var(--red); } .stat.yellow b { color: var(--yellow); }
  .stat.blue b { color: var(--blue); } .stat.new b { color: var(--purple); } .stat.fixed b { color: var(--green); }
  .stat[data-sev].active { border-color: var(--accent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
  /* Toolbar: severity filters + live search. */
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .filters { display: flex; gap: 5px; }
  .fpill { padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .fpill.active { background: linear-gradient(180deg, #4a7bff, #3362f0); border-color: #2a52d8; color: #fff; }
  .fpill.high.active { background: linear-gradient(180deg, color-mix(in srgb, var(--red) 70%, #000), var(--red)); border-color: var(--red); }
  .fpill.medium.active { background: linear-gradient(180deg, color-mix(in srgb, var(--yellow) 70%, #000), var(--yellow)); border-color: var(--yellow); color: #201400; }
  .fpill.info.active { background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 70%, #000), var(--blue)); border-color: var(--blue); }
  #search { flex: 1; min-width: 150px; background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 6px 12px; color: var(--text); font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .toolbtn { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent); }
  /* Findings: single column, centered for readability. Groups stack cleanly. */
  #report { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
  #report > .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  #nomatch { text-align: center; color: var(--muted); padding: 24px 0; font-size: 13px; }
  #drillhint { text-align: center; color: var(--muted); padding: 32px 0; font-size: 13.5px; border: 1px dashed var(--border); border-radius: var(--radius); margin-bottom: 10px; }
  .filterbar { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto 10px; font-size: 12.5px; color: var(--muted); }
  .filterbar b { color: var(--text); font-weight: 700; }
  .filterbar button { padding: 2px 10px; font-size: 11.5px; border-radius: 7px; }
  .group { background: linear-gradient(180deg, var(--card), var(--card)); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .group summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 13px; cursor: pointer; user-select: none; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
  .group.high summary { color: var(--red); }
  .group.medium summary { color: var(--yellow); }
  .group.info summary { color: var(--blue); }
  .group summary::-webkit-details-marker { display: none; }
  .group summary b { color: var(--text); }
  .group summary .chev { margin-left: auto; font-size: 11px; transition: transform .18s ease; color: var(--muted); }
  .group[open] summary .chev { transform: rotate(90deg); }
  .group-body { padding: 0 8px 8px; }
  .group .card { border: none; background: var(--card2); margin-bottom: 6px; }
  .group .card:last-child { margin-bottom: 0; }
  .crow { border-left: 3px solid var(--blue); border-radius: 6px; margin-bottom: 3px; background: transparent; transition: background .15s ease; }
  .crow:hover { background: var(--card); }
  .crow summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 5px 9px; cursor: pointer; user-select: none; }
  .crow summary::-webkit-details-marker { display: none; }
  .crow summary h3 { font-size: 12.5px; font-weight: 550; flex: 1; letter-spacing: -0.01em; color: var(--text); }
  .crow summary .chev { color: var(--muted); font-size: 11px; transition: transform .18s ease; }
  .crow[open] summary .chev { transform: rotate(90deg); }
  .crow[open] { background: var(--card); }
  .crow .card-body { padding: 0 10px 9px 12px; }
  .crow .fix .fixtext { font-size: 11.5px; }
  .card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--muted); border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color .15s ease, transform .12s ease; }
  .card:hover { border-color: color-mix(in srgb, var(--border) 55%, var(--text) 45%); }
  .card.high { border-left-color: var(--red); }
  .card.medium { border-left-color: var(--yellow); }
  .card.info { border-left-color: var(--blue); }
  .card summary { list-style: none; display: flex; align-items: center; gap: 9px; padding: 9px 12px; cursor: pointer; user-select: none; }
  .card summary::-webkit-details-marker { display: none; }
  .card summary h3 { font-size: 13.5px; font-weight: 620; flex: 1; letter-spacing: -0.01em; }
  .card summary .chev { color: var(--muted); font-size: 12px; transition: transform .18s ease; }
  .card[open] summary .chev { transform: rotate(90deg); }
  .card-body { padding: 0 12px 11px; animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  .badge { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
  .badge.high { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
  .badge.medium { background: color-mix(in srgb, var(--yellow) 16%, transparent); color: var(--yellow); }
  .badge.info { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
  .card .detail { color: var(--text); margin-top: 7px; font-size: 13.5px; }
  .evidence { margin-top: 9px; background: var(--evidence-bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .card:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--card2); }
  details.ev { margin-top: 9px; }
  details.ev summary { cursor: pointer; color: var(--blue); font-size: 12.5px; user-select: none; }
  .fix { margin-top: 9px; display: flex; gap: 8px; align-items: flex-start; }
  .fix .fixtext { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-family: var(--mono); font-size: 12px; flex: 1; color: var(--text); }
  .fix button { flex-shrink: 0; }
  .fix .reportbtn { flex-shrink: 0; align-self: center; font-size: 12px; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
  .fix .reportbtn:hover { color: var(--text); background: var(--hover); }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
  #trend { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .trendtitle { font-size: 12px; color: var(--muted); }
  .trendtitle b { color: var(--text); }
  #trend svg { flex-shrink: 0; }
  #trend .trend-wrap { display: flex; align-items: center; gap: 14px; width: 100%; }
  #trend { max-width: 720px; margin-left: auto; margin-right: auto; }
  #fixed, #skipped { max-width: 720px; margin-left: auto; margin-right: auto; }
  #fixed, #skipped { margin-bottom: 10px; }
  @media (max-width: 700px) {
    header { flex-wrap: wrap; }
    .actions { margin-left: 0; width: 100%; }
    .hero-stats { gap: 4px; margin-left: 0; margin-top: 10px; }
    .stat { min-width: 0; padding: 3px 8px; }
    #summary { flex-wrap: wrap; gap: 12px; padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🩺</span>
    <div>
      <h1>Linux Doctor</h1>
      <div class="sysinfo" id="sysinfo">Loading…</div>
    </div>
    <div class="actions">
      <button id="theme" title="Theme">🌓</button>
      <button id="export" title="Copy the report as Markdown">⧉ Copy</button>
      <button id="rerun" class="primary">↻ Re-run checks</button>
    </div>
  </header>
  <div id="banner" class="banner">Running checks…</div>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <input id="search" type="search" placeholder="Filter findings…" autocomplete="off" spellcheck="false">
    <button id="expandall" class="toolbtn">⊞ Expand all</button>
  </div>
  <div id="filterbar" class="filterbar" hidden><span id="filterbar-txt"></span><button id="filterbar-clear" type="button">Clear</button></div>
  <div id="trend" hidden></div>
  <div id="drillhint" class="empty" hidden></div>
  <div id="report"><div class="empty">Running checks…</div></div>
  <div id="nomatch" class="empty" hidden></div>
  <details id="fixed" class="group" hidden>
    <summary>✅ Fixed since last check <b id="fixed-count"></b><span class="chev">▸</span></summary>
    <div class="group-body" id="fixed-body"></div>
  </details>
  <details id="skipped" class="group" hidden>
    <summary>Skipped checks <b id="skipped-count"></b><span class="chev">▸</span></summary>
    <div class="group-body" id="skipped-body"></div>
  </details>
  <footer>Linux Doctor only reads system information — it never modifies anything.<br><kbd>↑</kbd> <kbd>↓</kbd> navigate findings · <kbd>Enter</kbd> open/close</footer>
</div>
<script>
// The desktop app fetches its report over loopback HTTP — see
// src-tauri/src/lib.rs for why we avoid Tauri IPC here.
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SEV = { high: { label: "High", cls: "high" }, medium: { label: "Medium", cls: "medium" }, info: { label: "Info", cls: "info" } };
const expandBtn = $("#expandall");
const themeBtn = $("#theme");
let statusTimer = null;
// True inside the Tauri desktop app, where the report is served over loopback
// HTTP on 17321. In a plain browser (--web) that port does not exist, so we
// skip the probes entirely instead of logging connection errors.
const isDesktop = () => typeof window !== "undefined" && !!window.__TAURI_INTERNALS__;
// The last fetched report, kept so the Ignore button can re-render locally
// (filtering one finding out) instead of re-running all checks.
let lastData = null;

// Theme: follows the system (prefers-color-scheme) by default; the 🌓 button
// cycles light → dark → auto. The choice is remembered in localStorage.
const THEME_ORDER = ["light", "dark", "auto"];
function currentTheme() { try { return localStorage.getItem("ld-theme") || "auto"; } catch { return "auto"; } }
function applyTheme() {
  const t = currentTheme();
  const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  themeBtn.textContent = t === "light" ? "☀️" : t === "dark" ? "🌙" : "🌓";
  themeBtn.title = "Theme: " + t + " — click to change";
}
themeBtn.addEventListener("click", () => {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];
  try { localStorage.setItem("ld-theme", next); } catch { /* private mode */ }
  applyTheme();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
applyTheme();

// "Checked X ago" pill: relative time, refreshed every 30s. Goes amber when
// the report is older than an hour (stale cron/desktop run).
function setStatus(generatedAt) {
  const txt = $("#statuspill-txt");
  const dot = $("#statusdot");
  const ms = Date.now() - new Date(generatedAt).getTime();
  const secs = Math.max(0, Math.round(ms / 1000));
  let label;
  if (secs < 5) label = "checked just now";
  else if (secs < 60) label = "checked " + secs + "s ago";
  else if (secs < 3600) label = "checked " + Math.floor(secs / 60) + "m ago";
  else if (secs < 86400) label = "checked " + Math.floor(secs / 3600) + "h ago";
  else label = "checked " + Math.floor(secs / 86400) + "d ago";
  txt.textContent = label;
  dot.className = "dot" + (secs >= 3600 ? " stale" : "");
}

async function fetchReport() {
  // Desktop app: the Rust shell serves the report over loopback HTTP.
  // Try it first, then fall back to the browser dashboard endpoint (--web).
  if (isDesktop()) {
    try {
      const res = await fetch("http://127.0.0.1:17321/report", { cache: "no-store" });
      if (res.ok) return res.json();
    } catch {
      /* loopback server not up yet */
    }
  }
  const res = await fetch("/api/report", { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function load() {
  const banner = $("#banner");
  const report = $("#report");
  const rerun = $("#rerun");
  banner.className = "banner running";
  banner.innerHTML = '<span class="spinner"></span>Running checks…';
  expandBtn.textContent = "⊞ Expand all";
  report.innerHTML = '<div class="empty"><span class="spinner"></span>Running checks…</div>';
  rerun.disabled = true;
  rerun.textContent = "↻ Running…";
  try {
    render(await fetchReport());
  } catch (err) {
    banner.className = "banner warn";
    banner.innerHTML = "";
    banner.textContent = "⚠️ Could not run checks: " + (err && err.message ? err.message : err);
    report.innerHTML = '<div class="empty">Run failed — see the message above. Make sure Node.js ≥ 20 is installed and on PATH.</div>';
  } finally {
    rerun.disabled = false;
    rerun.textContent = "↻ Re-run checks";
  }
}

// Sparkline of the health score from local history (last N runs). Hidden when
// there are fewer than two runs. Tries the desktop server, then the web one.
async function renderTrend() {
  const trend = $("#trend");
  let runs = [];
  if (isDesktop()) {
    try {
      const res = await fetch("http://127.0.0.1:17321/history", { cache: "no-store" });
      if (res.ok) runs = (await res.json()).runs || [];
    } catch { /* loopback server not up yet */ }
  }
  if (!runs.length) {
    try {
      const res = await fetch("/api/history", { cache: "no-store" });
      if (res.ok) runs = (await res.json()).runs || [];
    } catch { /* no history endpoint */ }
  }
  const scores = runs.map((r) => r.score).filter((s) => typeof s === "number");
  trend.hidden = scores.length < 2;
  if (trend.hidden) return;

  const W = 240, H = 44, pad = 4;
  const min = Math.min(...scores), max = Math.max(...scores);
  const span = Math.max(1, max - min);
  const pts = scores.map((s, i) => {
    const x = pad + (i * (W - 2 * pad)) / (scores.length - 1);
    const y = H - pad - ((s - min) / span) * (H - 2 * pad);
    return [x.toFixed(1), y.toFixed(1)];
  });
  const last = scores[scores.length - 1];
  const color = last >= 80 ? "var(--green)" : last >= 50 ? "var(--yellow)" : "var(--red)";
  const line = pts.map((p) => p.join(",")).join(" ");
  // Area chart: the same polyline closed down to the bottom edge.
  const area = "M" + line.replace(/ /g, " L") + " L" + (W - pad) + "," + (H - pad) + " L" + pad + "," + (H - pad) + " Z";
  // Tooltip: one transparent circle per point, wide hit area, native <title>.
  const dots = pts.map((p, i) =>
    '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="transparent" style="cursor:crosshair">' +
    '<title>' + scores[i] + '/100 · run ' + (i + 1) + ' of ' + scores.length + '</title></circle>');
  const end = pts[pts.length - 1];
  trend.innerHTML =
    '<div class="trend-wrap">' +
    '<div class="trendtitle">Health score · last ' + scores.length + ' run(s): <b>' + last + '/100</b></div>' +
    '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Health score trend">' +
    '<path d="' + area + '" fill="' + color + '" opacity="0.18"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots.join("") +
    '<circle cx="' + end[0] + '" cy="' + end[1] + '" r="3" fill="' + color + '"/>' +
    '</svg>' +
    '</div>';
}

// Animated count-up for the score. Cheap (one element + one SVG ring, ~900ms).
const SCORE_RING_R = 25;
const SCORE_RING_C = 2 * Math.PI * SCORE_RING_R;
function animateScore(target) {
  const num = $("#scorenum");
  const ring = $("#scorering");
  if (!num) return;
  const t0 = performance.now();
  const dur = 900;
  const step = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    // Ease-out so the big jump at the start reads as "counting up".
    const v = target * (1 - Math.pow(1 - p, 3));
    num.textContent = Math.round(v);
    if (ring) ring.style.strokeDashoffset = SCORE_RING_C * (1 - v / 100);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Severity filter + live search. Pure DOM toggles — no re-fetch.
// activeFilter: null = report hidden (drill-down), "all" = every group,
// "high"/"medium"/"info" = that group only. Defaults to "all" so the report
// is visible as soon as the app opens.
let activeFilter = "all";

function renderFilters(counts) {
  // Counts live on the summary cards only; pills are pure severity labels.
  const defs = ["all", "high", "medium", "info"];
  $("#filters").innerHTML = defs.map((sev) =>
    '<button class="fpill ' + sev + (activeFilter === sev ? " active" : "") + '" data-sev="' + sev + '">' +
    { all: "All", high: "High", medium: "Medium", info: "Info" }[sev] + '</button>'
  ).join("");
}

function applyFilters() {
  const report = $("#report");
  const hint = $("#drillhint");
  report.hidden = !activeFilter;
  hint.hidden = !!activeFilter;
  if (activeFilter) {
    hint.textContent = "";
  } else {
    hint.textContent = "Select a severity to see findings.";
  }
  // Filter status line: only when a specific severity is active.
  const filterbar = $("#filterbar");
  const fbTxt = $("#filterbar-txt");
  if (activeFilter && activeFilter !== "all") {
    filterbar.hidden = false;
    fbTxt.textContent = "Showing " + { high: "High", medium: "Medium", info: "Info" }[activeFilter] + " only";
  } else {
    filterbar.hidden = true;
    fbTxt.textContent = "";
  }
  const q = $("#search").value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll("#report .group").forEach((g) => {
    const sev = g.classList.contains("high") ? "high" : g.classList.contains("medium") ? "medium" : "info";
    const sevOk = activeFilter === "all" || sev === activeFilter;
    let any = false;
    g.querySelectorAll(".card, .crow").forEach((c) => {
      const match = !q || c.textContent.toLowerCase().includes(q);
      c.style.display = match ? "" : "none";
      if (match) any = true;
    });
    g.hidden = !(sevOk && any);
    if (sevOk && any) visible++;
  });
  const nomatch = $("#nomatch");
  const qRaw = $("#search").value.trim();
  nomatch.hidden = !(activeFilter && qRaw && visible === 0);
  if (!nomatch.hidden) nomatch.textContent = 'No findings match "' + qRaw + '".';
  syncCardActive();
}

// The active severity chip highlights its matching summary card, linking the
// "state" layer (cards) to the "control" layer (chips) so they read as one.
function syncCardActive() {
  document.querySelectorAll("#summary .stat[data-sev]").forEach((s) => {
    s.classList.toggle("active", activeFilter === s.dataset.sev);
  });
}

$("#filterbar-clear").addEventListener("click", () => {
  activeFilter = "all";
  document.querySelectorAll(".fpill").forEach((b) => b.classList.toggle("active", b.dataset.sev === activeFilter));
  syncGroupsOpen();
  applyFilters();
});

function syncGroupsOpen() {
  // Filtering reveals the group — open it so findings are visible right away.
  // On "All", only High opens (progressive disclosure: Informational can hold
  // dozens of items); a specific severity opens its own group.
  document.querySelectorAll("#report .group").forEach((g) => {
    const sev = g.classList.contains("high") ? "high" : g.classList.contains("medium") ? "medium" : "info";
    g.open = activeFilter === sev || (activeFilter === "all" && sev === "high");
  });
}

$("#filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".fpill");
  if (!btn) return;
  activeFilter = activeFilter === btn.dataset.sev ? null : btn.dataset.sev;
  document.querySelectorAll(".fpill").forEach((b) => b.classList.toggle("active", b.dataset.sev === activeFilter));
  syncGroupsOpen();
  applyFilters();
});
$("#search").addEventListener("input", applyFilters);

// "Checks that were skipped on this system": pull /api/checks (the web server
// serves it; the desktop app returns nothing, so the section stays hidden).
async function renderSkipped() {
  const box = $("#skipped");
  let checks = [];
  if (isDesktop()) {
    try {
      const res = await fetch("http://127.0.0.1:17321/checks", { cache: "no-store" });
      if (res.ok) checks = (await res.json()).checks || [];
    } catch { /* loopback server not up yet */ }
  }
  if (!checks.length) {
    try {
      const res = await fetch("/api/checks", { cache: "no-store" });
      if (res.ok) checks = (await res.json()).checks || [];
    } catch { /* no checks endpoint */ }
  }
  const skipped = checks.filter((c) => !c.appliesHere);
  box.hidden = !skipped.length;
  if (!skipped.length) return;
  $("#skipped-count").textContent = skipped.length;
  $("#skipped-body").innerHTML = skipped.map((c) =>
    '<div class="card info"><summary><span class="badge info">skipped</span>' +
    '<h3>' + esc(c.title) + '</h3><span class="checkid">' + esc(c.id) + '</span>' +
    '<span class="chev">▸</span></summary>' +
    '<div class="card-body"><div class="detail">Only runs on: ' + esc(c.appliesTo.join(", ")) + '.</div></div></div>'
  ).join("");
}

// Export: copy the whole report as Markdown. Plain text in the clipboard, so
// it pastes into issues, Slack, notes — wherever.
function reportMarkdown(data) {
  const { system = {}, findings = [] } = data;
  const lines = [];
  lines.push("# Linux Doctor report");
  lines.push("");
  lines.push("- **System:** " + [system.distro, system.kernel, (system.cores || "?") + " core(s)", "up " + system.uptime].filter(Boolean).join(" · "));
  if (typeof data.score === "number") {
    lines.push("- **Health:** " + data.score + "/100" +
      (typeof data.scoreDelta === "number" ? " (" + (data.scoreDelta > 0 ? "+" + data.scoreDelta : data.scoreDelta) + " since last check)" : ""));
  }
  lines.push("- **Checks:** " + (data.checksRun ?? "?") + " ran, " + (data.checksSkipped ?? 0) + " skipped");
  lines.push("");
  const order = ["high", "medium", "info"];
  const names = { high: "High severity", medium: "Medium severity", info: "Informational" };
  let count = 0;
  for (const sev of order) {
    const group = findings.filter((f) => f.severity === sev);
    if (!group.length) continue;
    lines.push("## " + names[sev] + " (" + group.length + ")");
    lines.push("");
    for (const f of group) {
      count++;
      lines.push((count) + ". **" + (f.title || "") + "**" + (f.code ? " (`" + f.code + "`)" : ""));
      if (f.detail) lines.push("   - Detail: " + f.detail);
      if (f.evidence) lines.push("   - Evidence: " + f.evidence);
      // Fix text itself may contain backticks, so no inline code fence here.
      if (f.fix) lines.push("   - Fix: " + f.fix);
      lines.push("");
    }
  }
  if (!count) lines.push("No findings.");
  return lines.join("\n");
}

function render(data) {
  lastData = data;
  const { findings = [], system = {} } = data;
  const ver = (data.version || "").replace(/^v/, "");
  $(".sysinfo").innerHTML =
    [system.distro, system.kernel, (system.cores || "?") + " core(s)", "up " + system.uptime].filter(Boolean).join(" · ") +
    (typeof data.score === "number" ? " · Health " + data.score + "/100" +
      (typeof data.scoreDelta === "number" ? " (" + (data.scoreDelta > 0 ? "+" + data.scoreDelta : data.scoreDelta) + " since last check)" : "") : "") +
    ' · <span class="dot" id="statusdot"></span><span id="statuspill-txt"></span>' +
    (ver ? ' · <span class="ver">v' + ver + "</span>" : "");
  const count = (s) => findings.filter((f) => f.severity === s).length;
  const high = count("high"), med = count("medium"), inf = count("info");

  // "Report wrong" opens a pre-filled GitHub issue — the feedback loop for
  // false positives. Every field is URL-encoded, so odd titles/evidence are
  // safe in the query string.
  const wrongUrl = (f) =>
    "https://github.com/zShaD0w7x/linux-doctor-cli/issues/new?" +
    "title=" + encodeURIComponent("Wrong finding: " + (f.code || f.title)) +
    "&body=" + encodeURIComponent(
      "**Finding:** " + (f.title || "") + "\n" +
      "**Severity:** " + (f.severity || "") + "\n" +
      "**Check:** " + (f.check || "") + "\n" +
      "**Code:** " + (f.code || "") + "\n" +
      "**Version:** " + (data.version || "") + "\n\n" +
      "This finding looks wrong because:\n\n[describe what you expected]\n\n---\n" +
      "Full report: `linux-doctor --json`");

  const banner = $("#banner");
  if (high + med === 0) {
    banner.className = "banner ok";
    banner.textContent = "All checks passed — system looks healthy.";
  } else {
    const parts = [];
    if (high) parts.push(high + " high-severity " + (high === 1 ? "issue" : "issues"));
    if (med) parts.push(med + " medium-severity " + (med === 1 ? "issue" : "issues"));
    banner.className = "banner warn";
    banner.textContent = parts.join(" and ") + " need attention — see below.";
  }

  // Icons on the hero stats (not just color) so the report reads fine for
  // color-blind users: 🔴 red circle, 🟡 yellow circle, 🔵 blue circle.
  const scoreDelta = typeof data.scoreDelta === "number" ? data.scoreDelta : null;
  const deltaCls = scoreDelta === null ? "" : scoreDelta > 0 ? "delta-up" : scoreDelta < 0 ? "delta-down" : "delta-flat";
  const deltaTxt = scoreDelta === null ? "no history to compare" : scoreDelta > 0 ? "▲ +" + scoreDelta : scoreDelta < 0 ? "▼ " + scoreDelta : "◆ no change";
  const score = typeof data.score === "number" ? data.score : 0;
  const scoreColor = score >= 80 ? "var(--green)" : score >= 50 ? "var(--yellow)" : "var(--red)";
  $("#summary").innerHTML =
    '<div class="gauge">' +
    '<svg viewBox="0 0 62 62" role="img" aria-label="Health score ' + score + ' of 100">' +
    '<circle class="track" cx="31" cy="31" r="' + SCORE_RING_R + '"></circle>' +
    '<circle class="ring" id="scorering" cx="31" cy="31" r="' + SCORE_RING_R + '" ' +
    'transform="rotate(-90 31 31)" stroke="' + scoreColor + '" ' +
    'stroke-dasharray="' + SCORE_RING_C + '" stroke-dashoffset="' + SCORE_RING_C + '"></circle>' +
    '</svg>' +
    '<div class="gauge-center"><div class="scorenum" id="scorenum">0</div><div class="scoreout">/ 100</div></div>' +
    '</div>' +
    '<div class="hero-main"><div class="k">Health</div>' +
    '<div class="scoredelta ' + deltaCls + '">' + deltaTxt + '</div></div>' +
    '<div class="hero-stats">' +
    '<div class="stat red" data-sev="high"><b>' + high + '</b><span>high</span></div>' +
    '<div class="stat yellow" data-sev="medium"><b>' + med + '</b><span>medium</span></div>' +
    '<div class="stat blue" data-sev="info"><b>' + inf + '</b><span>info</span></div>' +
    (data.newCount > 0 ? '<div class="stat new"><b>' + data.newCount + '</b><span>new</span></div>' : "") +
    (data.fixedCount > 0 ? '<div class="stat fixed"><b>' + data.fixedCount + '</b><span>fixed</span></div>' : "") +
    '</div>';
  animateScore(score);
  renderFilters({ high, medium: med, info: inf });

  if (data.generatedAt) {
    setStatus(data.generatedAt);
    clearInterval(statusTimer);
    statusTimer = setInterval(() => setStatus(data.generatedAt), 30000);
  }

  const order = ["high", "medium", "info"];
  const names = { high: "High severity", medium: "Medium severity", info: "Informational" };
  let html = "";
  for (const sev of order) {
    const group = findings.filter((f) => f.severity === sev);
    if (!group.length) continue;
    // One collapsible group per severity: High is open by default (the
    // actionable stuff), Medium/Info stay closed so the whole report fits on
    // one screen. High/Medium render as full cards (each its own accordion);
    // Informational renders as compact one-line rows so long lists stay
    // skimmable, with detail/fix revealed on expand.
    const open = sev === "high" ? " open" : "";
    const compact = sev === "info";
    html += '<details class="group ' + SEV[sev].cls + '"' + open + ">";
    html += "<summary>" + names[sev] + " <b>" + group.length + '</b><span class="chev">▸</span></summary>';
    html += '<div class="group-body">';
    for (const f of group) {
      const badges =
        (f.isNew ? '<span class="newbadge" title="Appeared since your last check">NEW</span>' : "") +
        (f.confidence === "low" ? '<span class="lowbadge" title="This finding may be a false positive">LOW CONF</span>' : "") +
        (f.check ? '<span class="checkid">' + esc(f.check) + "</span>" : "");
      if (compact) {
        html += '<details class="crow" tabindex="0">';
        html += '<summary><h3>' + esc(f.title) + '</h3>' + badges + '<span class="chev">▸</span></summary>';
      } else {
        html += '<details class="card ' + SEV[sev].cls + '" tabindex="0">';
        html += '<summary><h3>' + esc(f.title) + '</h3>' + badges + '<span class="chev">▸</span></summary>';
      }
      html += '<div class="card-body">';
      if (f.detail) html += '<div class="detail">' + esc(f.detail) + "</div>";
      if (f.evidence) {
        html += '<details class="ev"><summary>Evidence</summary><div class="evidence">' + esc(f.evidence) + "</div></details>";
      }
      html += '<div class="fix">';
      if (f.fix) html += '<div class="fixtext">' + esc(f.fix) + '</div>';
      html += '<button data-copy="' + esc(f.fix || f.detail || f.title) + '">Copy</button>';
      html += '<button data-ignore="' + esc(f.title) + '" title="Never report this finding again (saved to ~/.config/linux-doctor/config.json)">Ignore</button>';
      html += '<a class="reportbtn" href="' + wrongUrl(f) + '" target="_blank" rel="noopener" title="This finding looks wrong? Open a GitHub issue pre-filled with the details">Report wrong</a>';
      html += '</div>';
      html += "</div></details>";
    }
    html += "</div></details>";
  }
  $("#report").innerHTML = html || '<div class="empty">No issues found — system looks healthy.</div>';
  applyFilters();
  renderFixed(data);
  renderTrend();
  renderSkipped();
}

// "Fixed since last check": the diffSinceLast.fixed entries are findings that
// disappeared between runs (resolved). Green, celebratory, self-reinforcing.
function renderFixed(data) {
  const el = $("#fixed");
  const fixed = (data.diffSinceLast && data.diffSinceLast.fixed) || [];
  el.hidden = !fixed.length;
  if (!fixed.length) return;
  $("#fixed-count").textContent = fixed.length;
  $("#fixed-body").innerHTML = fixed.map((f) =>
    '<div class="card"><summary><span class="badge fixedbadge">fixed</span>' +
    '<h3>' + esc(f.title) + '</h3>' +
    (f.code ? '<span class="checkid">' + esc(f.code) + "</span>" : "") +
    '<span class="chev">▸</span></summary>' +
    '<div class="card-body"><div class="detail">This no longer shows up in the report.</div></div></div>'
  ).join("");
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // WebKitGTK has no async clipboard API without a secure context — fall back.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
    return ok;
  }
}

// POST an ignore pattern. Tries the desktop app's loopback server first, then
// the web dashboard server. Both write to the same config file.
async function ignoreFinding(title, btn) {
  const payload = JSON.stringify({ pattern: title });
  const tryPost = async (url) => {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: payload });
    return res.ok;
  };
  let ok = false;
  try { ok = await tryPost("http://127.0.0.1:17321/api/ignore"); } catch { ok = false; }
  if (!ok) { try { ok = await tryPost("/api/ignore"); } catch { ok = false; } }
  btn.disabled = true;
  btn.textContent = ok ? "✓ Ignored" : "✗ Could not save";
  if (ok && lastData) {
    // Re-render locally with the finding filtered out — no need to re-run
    // all checks just to hide one finding (the pattern is persisted
    // server-side, so a future "Re-run checks" stays consistent).
    lastData.findings = lastData.findings.filter((f) => f.title !== title);
    render(lastData);
  }
}

document.addEventListener("click", async (e) => {
  if (e.target.dataset.copy !== undefined) {
    await copyText(e.target.dataset.copy);
    const old = e.target.textContent;
    e.target.textContent = "✓ Copied";
    setTimeout(() => (e.target.textContent = old), 1200);
  }
  if (e.target.dataset.ignore !== undefined) {
    await ignoreFinding(e.target.dataset.ignore, e.target);
  }
});

// Keyboard navigation: ↑/↓ move between finding cards, Enter/Space toggles the
// focused card. Cards are focusable <details> elements (tabindex="0").
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const cards = [...document.querySelectorAll("#report .card")];
    if (!cards.length) return;
    let idx = cards.indexOf(document.activeElement);
    if (e.key === "ArrowDown") idx = idx < 0 ? 0 : Math.min(cards.length - 1, idx + 1);
    else idx = idx < 0 ? 0 : Math.max(0, idx - 1);
    e.preventDefault();
    cards[idx].focus({ preventScroll: true });
    cards[idx].scrollIntoView({ block: "nearest" });
  } else if ((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.classList.contains("card")) {
    const el = document.activeElement;
    if (el.open) el.removeAttribute("open");
    else el.setAttribute("open", "");
    e.preventDefault();
  }
});

// Expand/collapse every finding card at once. Clicking opens all when any is
// closed, and collapses all when everything is already open.
function setAllOpen(open) {
  document.querySelectorAll("#report .group, #report .card, #report .crow").forEach((el) => {
    if (open) el.setAttribute("open", "");
    else el.removeAttribute("open");
  });
  expandBtn.textContent = open ? "⊟ Collapse all" : "⊞ Expand all";
}
expandBtn.addEventListener("click", () => {
  const anyClosed = [...document.querySelectorAll("#report .group, #report .card, #report .crow")].some((el) => !el.open);
  setAllOpen(anyClosed);
});

$("#rerun").addEventListener("click", load);

// Export: copy the report as Markdown.
const exportBtn = $("#export");
exportBtn.addEventListener("click", async () => {
  if (!lastData) return;
  await copyText(reportMarkdown(lastData));
  const old = exportBtn.textContent;
  exportBtn.textContent = "✓ Copied";
  setTimeout(() => (exportBtn.textContent = old), 1200);
});

load();
</script>
