# cargo-audit configuration. CI runs it as `cd src-tauri && cargo audit`, so
# the file lives here.
#
# Every entry below is an "unmaintained" advisory in a transitive dependency we
# do not control (gtk-rs 0.18 -> glib; idna/url -> unic-*; a build-time
# proc-macro helper). Real vulnerabilities are fixed, not ignored — rustls was
# bumped to 0.23.45 for RUSTSEC-2026-0285. Reviewed 2026-09-15; drop an entry
# once upstream moves off the crate.
[advisories]
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained (build-time helper)
  "RUSTSEC-2024-0429", # glib VariantStrIter unsoundness (gtk-rs 0.18)
  "RUSTSEC-2025-0075", # unic-char-range unmaintained (idna/url)
  "RUSTSEC-2025-0080", # unic-common unmaintained (idna/url)
  "RUSTSEC-2025-0081", # unic-char-property unmaintained (idna/url)
  "RUSTSEC-2025-0098", # unic-ucd-version unmaintained (idna/url)
  "RUSTSEC-2025-0100", # unic-ucd-ident unmaintained (idna/url)
]
